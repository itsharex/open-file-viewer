name: 预览问题报告
description: 报告文件预览、样式或交互异常
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。为了准确复现问题，请务必上传出现异常的原始文件。
        上传前请移除敏感信息；GitHub 不支持的文件格式请先压缩为 ZIP。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请说明实际表现、出现问题的位置，以及你认为正确的效果。
      placeholder: 例如：DOCX 表格内的项目符号越过了单元格边界。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出从加载文件到出现问题的完整操作步骤。
      placeholder: |
        1. 打开在线预览页面
        2. 选择附件中的文件
        3. 滚动到第 2 页的表格
    validations:
      required: true

  - type: upload
    id: sample-file
    attributes:
      label: 问题文件
      description: 必须上传可复现问题的原始文件；不支持的扩展名请压缩为 ZIP，单个文件最大 25 MB。
    validations:
      required: true
      accept: ".zip,.gz,.pdf,.docx,.xlsx,.pptx,.png,.jpg,.jpeg,.gif,.svg,.webp,.json,.log,.txt,.csv"

  - type: upload
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 可选。请标出异常位置，便于快速定位。
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"

  - type: input
    id: browser
    attributes:
      label: 浏览器及版本
      placeholder: 例如：Chrome 140 / macOS 15
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Open File Viewer 版本
      placeholder: 例如：@open-file-viewer/core 0.1.34，或官网在线预览
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已确认附件不包含密码、密钥、个人隐私或其他不应公开的信息。
          required: true
        - label: 我已搜索现有 Issues，确认没有重复报告。
          required: true
